[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macstack"
version = "0.1.0a0"
description = "Local plain-text Moodle STACK question authoring, testing, live preview, and rmaxima tool for macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "lxml>=5.2.0",
    "rich>=13.7.0",
    "starlette>=0.38.0",
    "tomli-w>=1.0.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
    "watchfiles>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
macstack = "macstack.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/macstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
